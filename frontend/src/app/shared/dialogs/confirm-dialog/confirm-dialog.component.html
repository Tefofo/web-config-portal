<h2 mat-dialog-title id="confirm-dialog-title">
  @if (data.danger) {
    <mat-icon color="warn" aria-hidden="true">warning</mat-icon>
  }
  {{ data.title }}
</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="loading()">
    {{ data.cancelLabel ?? 'Cancel' }}
  </button>
  <button
    mat-flat-button
    type="button"
    [color]="data.danger ? 'warn' : 'primary'"
    (click)="confirm()"
    [disabled]="loading()"
  >
    @if (loading()) {
      <mat-progress-spinner diameter="18" mode="indeterminate" />
    } @else {
      {{ data.confirmLabel ?? 'Confirm' }}
    }
  </button>
</mat-dialog-actions>
